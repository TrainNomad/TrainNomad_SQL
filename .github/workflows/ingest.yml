name: Ingestion Quotidienne Trains Européens

on:
  schedule:
    # Exécution tous les jours à 4h00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet de déclencher l'ingestion manuellement

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Exécuter l'ingestion des opérateurs européens
      run: |
        python ingest.py

    - name: Commit et Push de la base SQLite mise à jour
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add eu_trains.db
        git commit -m "Auto-update: Mise à jour quotidienne de la base eu_trains.db" || exit 0
        git push