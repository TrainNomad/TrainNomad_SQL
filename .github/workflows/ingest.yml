name: Ingestion Hebdomadaire Trains Européens

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Exécuter l'ingestion
      run: |
        python ingest.py

    - name: Compresser la base SQLite
      run: |
        gzip -f -9 eu_trains.db

    - name: Commit et Push de la base SQLite compressée
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f eu_trains.db.gz
        git commit -m "Auto-update: Base SQLite compressée" || exit 0
        git push