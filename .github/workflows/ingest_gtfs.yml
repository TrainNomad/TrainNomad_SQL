name: Ingestion Hebdomadaire GTFS API

on:
  schedule:
    # Exécution chaque dimanche à 4h00 UTC (après la compilation du dépôt TrainNomad_GTFS à 3h00)
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  download-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Télécharger le réseau compilé (API Go)
      run: |
        curl -fL -o network.bin.gz "https://raw.githubusercontent.com/TrainNomad/TrainNomad_GTFS/main/network.bin.gz"

    # Ancienne base SQLite (API FastAPI) : à supprimer une fois l'API Go en production.
    - name: Télécharger le fichier .db.gz (ancienne API)
      continue-on-error: true
      run: |
        curl -fL -o gtfs_indexed.db.gz "https://raw.githubusercontent.com/TrainNomad/TrainNomad_GTFS/main/gtfs_indexed.db.gz"

    # Garde à jour le réseau de secours embarqué dans l'image (sans redéployer : cf. buildFilter de
    # render.yaml). L'API en ligne, elle, lit la Release network-latest du dépôt TrainNomad_GTFS.
    - name: Commit et Push du réseau de secours
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add network.bin.gz gtfs_indexed.db.gz
        git commit -m "Auto-update: Synchronisation hebdomadaire du réseau GTFS" || exit 0
        git push
