name: Ingestion Hebdomadaire GTFS SNCF

on:
  schedule:
    # Exécution chaque dimanche à 3h00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permet de déclencher l'ingestion manuellement

jobs:
  download-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Télécharger la base de données GTFS harmonisée
      run: |
        curl -L -o harmonized_gtfs.db.gz "https://raw.githubusercontent.com/TrainNomad/TrainNomad_GTFS/main/harmonized_gtfs.db.gz"

    - name: Commit et Push de la base de données mise à jour (.gz)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add harmonized_gtfs.db.gz
        git commit -m "Auto-update: Synchronisation hebdomadaire de la base GTFS" || exit 0
        git push