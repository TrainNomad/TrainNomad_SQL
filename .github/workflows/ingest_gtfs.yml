name: Ingestion Hebdomadaire GTFS TrainNomad

on:
  schedule:
    # Exécution chaque dimanche à 3h00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permet de déclencher l'ingestion manuellement

jobs:
  download-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Télécharger et décompresser la base GTFS
      run: |
        curl -L "https://raw.githubusercontent.com/TrainNomad/TrainNomad_GTFS/main/harmonized_gtfs.db.gz" | gunzip > gtfs_indexed.db

    - name: Commit et Push du fichier gtfs_indexed.db
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add gtfs_indexed.db
        git commit -m "Auto-update: Synchronisation hebdomadaire de la base GTFS" || exit 0
        git push